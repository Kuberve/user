[package]
name = "user"
version = "0.14.4"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Kuberve/user"
authors = ["Simonov Zakhar <zaharsimonov6087@gmail.com> (BlackZakha)"]
description = "Kuberve userspace programs (init, uart, tcp, kv, hw)"
readme = "README.md"

[[bin]]
name = "user"
path = "src/main.rs"

[[bin]]
name = "init"
path = "src/bin/init.rs"

[[bin]]
name = "uart"
path = "src/bin/uart.rs"

[[bin]]
name = "tcp"
path = "src/bin/tcp_client.rs"

[[bin]]
name = "kv"
path = "src/bin/kv.rs"

[[bin]]
name = "hw"
path = "src/bin/hello_win.rs"

[profile.dev]
panic = "abort"
opt-level = 2
lto = true

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[dependencies]
kuberve-libc = { git = "https://github.com/Kuberve/libc" }