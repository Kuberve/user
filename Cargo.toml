[package]
name = "user"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user"
path = "src/main.rs"

[[bin]]
name = "init"
path = "src/bin/init.rs"

[[bin]]
name = "uart"
path = "src/bin/uart.rs"

[profile.dev]
panic = "abort"
opt-level = 2
lto = true

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[dependencies]
kuberve-libc = { path = "../libc" }